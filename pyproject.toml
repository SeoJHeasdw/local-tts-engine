[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-tts-engine"
version = "0.1.0"
description = "Local Korean lecture TTS and personal voice engine for Apple Silicon"
readme = "README.md"
requires-python = ">=3.13.12,<3.14"
license = { text = "Private" }
authors = [{ name = "Jaeho Seo" }]
dependencies = [
  "mlx-audio[tts]==0.5.0",
  "numpy>=2.5,<2.6",
  "soundfile>=0.14,<0.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[project.scripts]
local-tts-pilot = "local_tts_engine.pilot:main"
local-tts-course-pilot = "local_tts_engine.course_pilot:main"
local-tts-course-catalog = "local_tts_engine.course_catalog:main"
local-tts-export-udemy = "local_tts_engine.export_udemy:main"
local-tts-prosody-candidates = "local_tts_engine.prosody_candidates:main"
local-tts-prepare-finetune = "local_tts_engine.finetune_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_tts_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
